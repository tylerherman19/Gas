name: Scrape Costco gas prices

on:
  # The GitHub-hosted schedule is disabled: Costco blocks/throttles GitHub
  # runner IPs, so the VM fetches every 3 hours (cron job costco-vm-scrape)
  # and dispatches this workflow with the payload as injected_prices.
  # The scheduled runs below are kept commented as documentation.
  # schedule:
  #   - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      injected_prices:
        description: "Raw Costco payload JSON keyed by warehouse id (from the VM fetcher); skips the live Costco fetch"
        required: false
        default: ""
  # Declared explicitly so a push can never end as "No jobs were run".
  # GitHub marks a run with zero jobs as failed and sends a failure email,
  # which is what happened on the 11:25 AM pushes. Pushes do nothing;
  # real scrapes only arrive via workflow_dispatch from the VM.
  push:

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  noop:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "push event: nothing to do (scrapes run via workflow_dispatch from the VM)"

  scrape:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: scrape
        run: npm run scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INJECTED_PRICES: ${{ inputs.injected_prices }}
