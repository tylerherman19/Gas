name: Scrape Costco gas prices

on:
  # The GitHub-hosted schedule is disabled: Costco blocks/throttles GitHub
  # runner IPs, so the VM fetches every 3 hours (cron job costco-vm-scrape)
  # and dispatches this workflow with the payload as injected_prices.
  # The scheduled runs below are kept commented as documentation.
  # schedule:
  #   - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      injected_prices:
        description: "Raw Costco payload JSON keyed by warehouse id (from the VM fetcher); skips the live Costco fetch"
        required: false
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: scrape
        run: npm run scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INJECTED_PRICES: ${{ inputs.injected_prices }}

      # Rebuild the site only when prices actually moved. Needs a Vercel
      # deploy-hook URL stored as the VERCEL_DEPLOY_HOOK repo secret;
      # the step is skipped entirely until that secret exists.
      - name: Trigger Vercel rebuild
        if: ${{ secrets.VERCEL_DEPLOY_HOOK != '' && steps.scrape.outputs.prices_changed == 'true' }}
        run: curl -sf -X POST "$DEPLOY_HOOK_URL"
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK }}
